# WORKFLOW: Scheduled Runner for bbot.py
# DESCRIPTION: Automates the scheduled execution of bbot.py using GitHub Actions.
# It provisions an Ubuntu runner, sets up Python, installs dependencies, and passes repository secrets to run the script.

on:
  schedule:
    # Schedule triggers (06:17, 12:17, and 17:17 UTC)
    # Equals 07:17, 13:17, and 18:17 BST during UK daylight saving time
    - cron: '17 6 * * *'
    - cron: '17 12 * * *'
    - cron: '17 17 * * *'
  # Critical: Enables manual trigger button in GitHub Actions UI for testing
  workflow_dispatch:

jobs:
  run-daily-script:
    # Critical: Defines the OS environment provided by GitHub to execute steps
    runs-on: ubuntu-latest
    steps:
      # Critical: Downloads repository files onto the runner so bbot.py is accessible
      - name: Checkout repository code
        uses: actions/checkout@v4

      # Critical: Provisions the Python runtime environment on the runner
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # Critical: Installs required Python packages listed in requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Critical: Runs bbot.py while injecting repository secrets as environment variables
      - name: Run broadcast script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GREEN_API_INSTANCE_ID: ${{ secrets.GREEN_API_INSTANCE_ID }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          WHATSAPP_PHONE_NUMBER: ${{ secrets.WHATSAPP_PHONE_NUMBER }}
        run: python bbot.py