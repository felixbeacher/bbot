name: Morning, Afternoon & Evening Broadcast

on:
  schedule:
    # Runs at 06:17, 12:17, and 17:17 UTC
    # (Equals 07:17, 13:17, and 18:17 BST in UK daylight savings)
    - cron: '17 4 * * *'
    - cron: '17 6 * * *'
    - cron: '17 12 * * *'
  workflow_dispatch: # Enables manual "Run workflow" testing button

jobs:
  run-daily-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run broadcast script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GREEN_API_INSTANCE_ID: ${{ secrets.GREEN_API_INSTANCE_ID }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          WHATSAPP_PHONE_NUMBER: ${{ secrets.WHATSAPP_PHONE_NUMBER }}
        run: python bbot.py
